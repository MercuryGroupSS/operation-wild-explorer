name: One-time import of the approved mobile game

on:
  push:
    branches: [setup/import-mobile-v2]
    paths: [.github/workflows/import-mobile-v2.yml]

permissions:
  contents: write

concurrency:
  group: import-approved-mobile-v2
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'MercuryGroupSS/operation-wild-explorer' && github.ref == 'refs/heads/setup/import-mobile-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the isolated import branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: setup/import-mobile-v2
          persist-credentials: true
      - name: Verify and unpack the original package without changing the game
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path('Operation_Wild_Explorer_GitHub_Ready.zip')
          expected = '443980aed2bf320dc4184a5b1a4947765bd8ef1d86cd3b6079d99a28d3eccd9f'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Archive changed; refusing an unverified import.')
          root = Path.cwd().resolve()
          with zipfile.ZipFile(archive) as package:
              entries = package.infolist()
              if len(entries) != 21 or sum(x.file_size for x in entries) > 1000000:
                  raise SystemExit('Unexpected archive contents.')
              pending = []
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] != 'operation-wild-explorer':
                      raise SystemExit('Unsafe archive path.')
                  relative = Path(*path.parts[1:])
                  if not relative.parts or relative.parts[0] == '.git' or '.github/workflows' in relative.as_posix():
                      raise SystemExit('Unexpected repository metadata in archive.')
                  if stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit('Symlinks are not allowed.')
                  target = (root / relative).resolve()
                  if root not in target.parents:
                      raise SystemExit('Path escapes repository.')
                  if target.exists() and relative.as_posix() != 'README.md':
                      raise SystemExit('Refusing to overwrite an existing source file: ' + str(relative))
                  pending.append((target, package.read(entry)))
              for target, contents in pending:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(contents)
          print('Imported 21 original files; gameplay and assets are unchanged.')
          PY
      - name: Validate the original game and deployment configuration
        run: node scripts/check.mjs
      - name: Commit unpacked source on the isolated branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public scripts docs netlify.toml .gitignore AGENTS.md CHANGELOG.md README.md .github/PULL_REQUEST_TEMPLATE.md
          git rm -- Operation_Wild_Explorer_GitHub_Ready.zip
          git diff --cached --stat
          git commit -m 'chore: import unchanged Wild Explorer mobile v2 source and assets'
          git push origin HEAD:refs/heads/setup/import-mobile-v2
