<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf5dc">
  <meta name="description" content="A little quest. A big adventure. A private, offline-ready nature adventure for your family. Photos are optional.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wild Explorer">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <link rel="preload" as="image" href="./assets/forest-friends-v2.webp">
  <link rel="stylesheet" href="./styles.css?v=3.0.2">
  <script src="./classic.js?v=3.0.2" defer></script>
  <script src="./engine.js?v=3.0.2" defer></script>
  <script src="./postcards.js?v=3.0.2" defer></script>
  <script src="./app.js?v=3.0.2" defer></script>
  <title>Operation Wild Explorer</title>
</head>
<body>
  <a class="skip" href="#main">Skip to the adventure</a>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="tab" data-value="home" aria-label="Wild Explorer home">
        <img src="./assets/icon.svg" alt="" width="44" height="44">
        <span><small>OPERATION</small><b>WILD EXPLORER</b></span>
      </button>
      <button class="round-btn" id="settings-button" data-action="settings" aria-label="Grown-up settings"><span data-icon="settings"></span></button>
    </header>
    <div id="save-warning" class="warning" role="alert" hidden></div>
    <div class="update-banner" id="update-banner" hidden><span>A fresh adventure update is ready.</span><button data-action="update">Update game</button></div>
    <section class="family-status" aria-label="Family progress">
      <div class="level-star" aria-hidden="true"><span data-icon="star"></span></div>
      <div class="status-main"><div class="status-line"><b id="level-text">Family level 1</b><span id="xp-text">0 XP</span></div><div class="xp-track" id="xp-meter" role="progressbar" aria-label="Experience towards next level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="xp-fill"></span></div></div>
      <button class="crystal-count" data-action="tab" data-value="treasure" aria-label="View collected crystals"><span id="tiny-gem"></span><b id="gem-count">0/5</b></button>
    </section>
    <main id="main" tabindex="-1">
      <section id="home-screen" data-screen="home" aria-label="Adventure home"></section>
      <section id="quest-screen" data-screen="quest" aria-label="Current quest" hidden></section>
      <section id="heroes-screen" data-screen="heroes" aria-label="Your five explorers" hidden></section>
      <section id="treasure-screen" data-screen="treasure" aria-label="Crystals and discoveries" hidden></section>
      <section id="trail-screen" data-screen="trail" aria-label="Story trail and optional location" hidden></section>
    </main>
    <footer class="page-foot"><span data-icon="leaf"></span> Tiny footsteps. Wonderful discoveries.</footer>
  </div>
  <nav class="bottom-nav" aria-label="Game sections">
    <button data-action="tab" data-value="home" aria-current="page"><span data-icon="home"></span><b>Play</b></button>
    <button data-action="tab" data-value="quest"><span data-icon="compass"></span><b>Quest</b></button>
    <button data-action="tab" data-value="heroes"><span data-icon="heroes"></span><b>Heroes</b></button>
    <button data-action="tab" data-value="treasure"><span data-icon="chest"></span><b>Treasure</b></button>
    <button data-action="tab" data-value="trail"><span data-icon="map"></span><b>Trail</b></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"><div id="sheet-content"></div></dialog>
  <input id="postcard-photo" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <noscript><div class="noscript">Please enable JavaScript to play. You can still enjoy a family colour hunt: find green, yellow, and brown from a safe path.</div></noscript>
</body>
</html>
